<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>شواهد — الحسابات التجريبية</title><link rel="stylesheet" href="shawahed-tokens.css"><style>
:root{font-family:system-ui,"IBM Plex Sans Arabic",sans-serif;color:#17333b;background:#f0f5f5}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:18px}header{background:#0c4a53;color:white;padding:18px}header>div{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:24px}h2{font-size:20px}p{line-height:1.8}.muted{color:#62777c}.notice{background:#fff1cf;color:#604a18;padding:12px;border-radius:12px;margin:16px 0}.card{background:white;border:1px solid #d8e6e8;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0c4a530b}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #b9cfd1;border-radius:10px;background:white}textarea{min-height:105px}button,.button{background:#0c646a;color:white;border:0;border-radius:10px;padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.button.secondary{background:#e7f2f2;color:#0c4a53}button:disabled{opacity:.55}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.stat{padding:16px;border-radius:12px;background:#eaf5f5}.stat strong{display:block;font-size:28px;color:#075e64}.item{padding:14px;border:1px solid #d7e4e5;border-radius:12px;margin:8px 0}.item summary{cursor:pointer;font-weight:700}.tag{font-size:12px;padding:4px 9px;border-radius:20px;background:#e9f4f4;color:#075e64}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.wide{max-width:500px}a{color:#0b6b72}@media(max-width:600px){main{padding:12px}.card{padding:15px}header{padding:14px}h1{font-size:21px}}@media print{header,nav,button,#login,.notice{display:none!important}.card{box-shadow:none}}
</style></head><body><header><div><h1>شواهد <small style="font-size:13px">| بيئة تجريبية</small></h1><a href="index.html" style="color:white">العودة للمنصة</a></div></header><main><p class="notice"><b>تجربة مستقلة:</b> هذه الحسابات وهمية وتعمل داخل المتصفح فقط، ولا تمنح وصولًا إلى بيانات المدارس الحقيقية أو قاعدة بيانات المنصة. كلمة المرور 123456 للتجربة فقط، ولا تصلح للحسابات الفعلية.</p><section id="login" class="card"><h2>الدخول بحساب تجريبي</h2><p class="muted">اختر الحساب ثم أدخل كلمة المرور الموحدة للتجربة.</p><form id="loginForm" class="wide"><label for="account">الحساب التجريبي</label><select id="account" required></select><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="off" placeholder="123456"><p id="error" role="alert"></p><button type="submit">الدخول للتجربة</button></form><p class="muted" id="count"></p></section><section id="app" class="hidden"><div class="card"><div class="row"><div><h2 id="identity"></h2><p id="school" class="muted"></p></div><button id="exit" class="secondary">تبديل الحساب</button></div><nav><button data-tab="overview">الرئيسية</button><button data-tab="records" class="secondary">ملف السجلات</button><button data-tab="tasks" class="secondary">المهام</button><button data-tab="schools" class="secondary">المدارس</button></nav></div><section id="overview" class="card"></section><section id="records" class="card hidden"></section><section id="tasks" class="card hidden"></section><section id="schools" class="card hidden"></section></section></main><script>
'use strict';
const $=id=>document.getElementById(id);
const roles=[['executive','مدير تنفيذي'],['principal','مدير مدرسة'],['teacher_vp','وكيل شؤون المعلمين'],['student_vp','وكيل شؤون الطلاب'],['academic_vp','وكيل الشؤون التعليمية'],['school_vp','وكيل الشؤون المدرسية'],['counselor','الموجّه الطلابي'],['activity','رائد النشاط'],['attendance','مسؤول الحضور والغياب'],['safety','مسؤول الأمن والسلامة'],['admin','إداري'],['teacher','معلم']];
const accounts=[{id:'exec',role:'executive',title:'مدير تنفيذي تجريبي',school:0}];
for(const [role,title] of roles.slice(1))for(let i=1;i<=5;i++)accounts.push({id:role+i,role,title:title+' '+i,school:i});
const schoolName=i=>'المدرسة التجريبية '+i;
const baseRecords={executive:['خطة الإشراف العام','متابعة المدارس الخمس','مؤشرات الأداء','محاضر الاجتماعات','تقارير التحسين'],principal:['الخطة التشغيلية','الزيارات الصفية','متابعة الأداء المدرسي','الانضباط المدرسي','خطة التحسين'],teacher_vp:['حضور المعلمين','الانتظار والمناوبة','التطوير المهني','توزيع الأنصبة','متابعة الأداء'],student_vp:['الانضباط الطلابي','الحضور والغياب','المخالفات السلوكية','التواصل مع أولياء الأمور','متابعة الحالات'],academic_vp:['متابعة التحصيل','الخطط الدراسية','الإشراف التربوي','تحليل النتائج','الخطة العلاجية'],school_vp:['المرافق والتجهيزات','الصيانة','الاحتياجات المدرسية','التشغيل اليومي','متابعة الخدمات'],counselor:['خطة التوجيه الطلابي','الحالات الطلابية','البرامج الإرشادية','التواصل مع الأسرة','التقارير'],activity:['خطة النشاط','البرامج والفعاليات','مشاركات الطلاب','توثيق الإنجازات','تقرير النشاط'],attendance:['سجل الحضور','حالات التأخر','متابعة الغياب','التنبيهات','التقارير'],safety:['خطة الإخلاء','فحص السلامة','تدريب الطوارئ','المخاطر','تقارير السلامة'],admin:['المراسلات','المعاملات','محاضر الاجتماعات','الأرشفة','المتابعة'],teacher:['الملف الشخصي','التخطيط للتدريس','تنفيذ التدريس','تقويم تعلم الطلاب','التطوير المهني','التواصل مع أولياء الأمور']};
const teacherSections=['أداء الواجبات الوظيفية','التفاعل مع المجتمع المهني','التفاعل مع أولياء الأمور','التنويع في استراتيجيات التدريس'];
let current=null;
function readData(){try{return JSON.parse(localStorage.getItem('shawahed-demo-v1')||'{}')}catch{return {}}}
function saveData(data){try{localStorage.setItem('shawahed-demo-v1',JSON.stringify(data));return true}catch{return false}}
function recordsFor(a){return a.role==='teacher'?Array.from({length:24},(_,i)=>({title:teacherSections[Math.floor(i/6)]+' — سجل '+(i+1)})):baseRecords[a.role].map(title=>({title}))}
function dataFor(a){const data=readData();return data[a.id]||{}}
function render(){const a=current;if(!a)return;$('identity').textContent=a.title;$('school').textContent=a.school?schoolName(a.school):'إشراف تجريبي على خمس مدارس';const rec=recordsFor(a),state=dataFor(a),done=rec.filter((_,i)=>state[i]?.status==='ready').length;
$('overview').replaceChildren();const h=document.createElement('h2');h.textContent='لوحة '+a.title;const stats=document.createElement('div');stats.className='grid';for(const [label,val] of [['السجلات التجريبية',rec.length],['جاهزة للمراجعة',done],['مسودة',rec.length-done],['نسبة الإنجاز',Math.round(done/rec.length*100)+'%']]){const el=document.createElement('div');el.className='stat';const l=document.createElement('span');l.textContent=label;const v=document.createElement('strong');v.textContent=val;el.append(l,v);stats.append(el)}const hint=document.createElement('p');hint.className='muted';hint.textContent='هذه أرقام تجريبية مبنية على مدخلاتك المحلية، وليست مؤشرات فعلية للمدارس.';$('overview').append(h,stats,hint);
$('records').replaceChildren();const title=document.createElement('h2');title.textContent='ملف السجلات — '+a.title;const note=document.createElement('p');note.className='muted';note.textContent='يمكن كتابة وصف وملاحظات وتغيير الحالة لتجربة سير العمل. تُحفظ البيانات محليًا على هذا الجهاز فقط، دون رفع مرفقات أو اعتماد رسمي.';$('records').append(title,note);
rec.forEach((r,i)=>{const details=document.createElement('details');details.className='item';const summary=document.createElement('summary');summary.textContent=(i+1)+'. '+r.title;const label=document.createElement('label');label.textContent='الحالة';const select=document.createElement('select');for(const [value,name] of [['draft','مسودة'],['ready','جاهز للمراجعة']])select.add(new Option(name,value));select.value=state[i]?.status||'draft';const descLabel=document.createElement('label');descLabel.textContent='وصف الإنجاز';const desc=document.createElement('textarea');desc.value=state[i]?.desc||'';const notesLabel=document.createElement('label');notesLabel.textContent='ملاحظات';const notes=document.createElement('textarea');notes.value=state[i]?.notes||'';const btn=document.createElement('button');btn.textContent='حفظ السجل التجريبي';const msg=document.createElement('p');msg.setAttribute('role','status');btn.onclick=()=>{const all=readData();all[a.id]||={};all[a.id][i]={status:select.value,desc:desc.value,notes:notes.value};msg.textContent=saveData(all)?'تم الحفظ محليًا على هذا الجهاز':'تعذر الحفظ في المتصفح';const ready=rec.filter((_,j)=>all[a.id][j]?.status==='ready').length;stats.children[1].querySelector('strong').textContent=ready;stats.children[2].querySelector('strong').textContent=rec.length-ready;stats.children[3].querySelector('strong').textContent=Math.round(ready/rec.length*100)+'%'};details.append(summary,label,select,descLabel,desc,notesLabel,notes,btn,msg);$('records').append(details)});
$('tasks').replaceChildren();const th=document.createElement('h2');th.textContent='مهام الدور التجريبي';const p=document.createElement('p');p.className='muted';p.textContent='بنود استرشادية لتجربة التنقل وليست تكليفات رسمية.';const ul=document.createElement('ul');baseRecords[a.role].forEach(t=>{const li=document.createElement('li');li.textContent='متابعة '+t;ul.append(li)});$('tasks').append(th,p,ul);
$('schools').replaceChildren();const sh=document.createElement('h2');sh.textContent='نطاق المدارس';$('schools').append(sh);const list=a.role==='executive'?[1,2,3,4,5]:[a.school];list.forEach(i=>{const div=document.createElement('div');div.className='item';div.textContent=schoolName(i)+(a.role==='executive'?' — ضمن نطاق المدير التنفيذي التجريبي':' — مدرستك التجريبية');$('schools').append(div)});
}
function switchTab(tab){for(const id of ['overview','records','tasks','schools'])$(id).classList.toggle('hidden',id!==tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('secondary',b.dataset.tab!==tab))}
accounts.forEach(a=>$('account').add(new Option(a.title+(a.school?' — '+schoolName(a.school):''),a.id)));$('count').textContent='عدد الحسابات: '+accounts.length+' (مدير تنفيذي واحد + 11 دورًا × 5 مدارس).';
$('loginForm').onsubmit=ev=>{ev.preventDefault();if($('password').value!=='123456'){$('error').textContent='كلمة المرور التجريبية غير صحيحة';return}current=accounts.find(a=>a.id===$('account').value);$('password').value='';$('error').textContent='';$('login').classList.add('hidden');$('app').classList.remove('hidden');render();switchTab('overview')};
$('exit').onclick=()=>{current=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
</script><script>
(function(){
const originalRender=render;
render=function(){originalRender();const active=current&&current.role==='executive';let nav=document.querySelector('[data-tab="schools"]').parentElement;let panel=document.getElementById('executivePanel');if(!panel){panel=document.createElement('section');panel.id='executivePanel';panel.className='card hidden';document.getElementById('app').append(panel);const btn=document.createElement('button');btn.textContent='متابعة المدارس والاعتمادات';btn.className='secondary';btn.id='execTab';btn.onclick=()=>{document.querySelectorAll('#app>section').forEach(x=>x.classList.add('hidden'));panel.classList.remove('hidden');nav.querySelectorAll('button').forEach(x=>x.classList.add('secondary'));btn.classList.remove('secondary')};nav.append(btn)}document.getElementById('execTab').classList.toggle('hidden',!active);if(!active){panel.classList.add('hidden');return}panel.replaceChildren();const heading=document.createElement('h2');heading.textContent='متابعة المدارس الخمس';panel.append(heading);const note=document.createElement('p');note.className='muted';note.textContent='مؤشرات حقيقية من بيانات التجربة المحلية، وليست بيانات مدارس فعلية.';panel.append(note);for(let i=1;i<=5;i++){const a=accounts.find(x=>x.role==='principal'&&x.school===i);const records=recordsFor(a),data=dataFor(a),ready=records.filter((_,j)=>data[j]?.status==='ready').length;const card=document.createElement('details');card.className='item';const title=document.createElement('summary');title.textContent='المدرسة التجريبية '+i+' — إنجاز '+Math.round(ready/records.length*100)+'% — بانتظار الاعتماد '+records.filter((_,j)=>data[j]?.status==='ready'&&data[j]?.approval!=='approved').length;card.append(title);records.forEach((rec,j)=>{const entry=data[j];if(entry?.status!=='ready'||entry.approval==='approved')return;const box=document.createElement('div');box.className='item';const name=document.createElement('b');name.textContent=rec.title;const comment=document.createElement('textarea');comment.placeholder='ملاحظات الإعادة';const approve=document.createElement('button');approve.textContent='اعتماد تجريبي';const reject=document.createElement('button');reject.textContent='إعادة بملاحظات';reject.className='secondary';function change(status){if(status==='returned'&&!comment.value.trim()){alert('اكتب ملاحظات الإعادة');return}const all=readData();all[a.id]||={};all[a.id][j]={...entry,approval:status,approvalNote:comment.value.trim(),status:status==='returned'?'draft':'ready'};if(saveData(all))render();else alert('تعذر الحفظ')}approve.onclick=()=>change('approved');reject.onclick=()=>change('returned');box.append(name,comment,approve,reject);card.append(box)});panel.append(card)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>document.getElementById('executivePanel')?.classList.add('hidden')));
})();
</script><script>
(function(){
const oldRender=render;
render=function(){
oldRender();
const active=current?.role==='executive';
let nav=document.querySelector('[data-tab="schools"]').parentElement;
let button=document.getElementById('executiveReportsTab'),panel=document.getElementById('executiveReports');
if(!button){button=document.createElement('button');button.id='executiveReportsTab';button.className='secondary';button.textContent='التقارير وحسابات المديرين';nav.append(button);panel=document.createElement('section');panel.id='executiveReports';panel.className='card hidden';document.getElementById('app').append(panel);button.onclick=()=>{document.querySelectorAll('#app>section').forEach(el=>el.classList.add('hidden'));panel.classList.remove('hidden');nav.querySelectorAll('button').forEach(el=>el.classList.add('secondary'));button.classList.remove('secondary')}}button.classList.toggle('hidden',!active);if(!active){panel.classList.add('hidden');return}
panel.replaceChildren();const h=document.createElement('h2');h.textContent='التقارير وحسابات مديري المدارس';panel.append(h);const p=document.createElement('p');p.className='muted';p.textContent='البيانات محسوبة من السجلات التجريبية على جهازك. إدارة الحسابات الفعلية غير مفعلة.';panel.append(p);
const table=document.createElement('div');table.style.overflowX='auto';const t=document.createElement('table');t.style.cssText='width:100%;border-collapse:collapse;text-align:right';const head=document.createElement('tr');for(const name of ['المدرسة','حساب المدير','السجلات','جاهزة','معتمدة','النواقص','الإنجاز']){const th=document.createElement('th');th.textContent=name;th.style.cssText='padding:10px;border-bottom:2px solid #cbdcdd;white-space:nowrap';head.append(th)}t.append(head);
let pending=0,approved=0;for(let i=1;i<=5;i++){const a=accounts.find(x=>x.role==='principal'&&x.school===i),records=recordsFor(a),data=dataFor(a);let ready=0,done=0;for(let j=0;j<records.length;j++){if(data[j]?.status==='ready')ready++;if(data[j]?.approval==='approved')done++}pending+=ready-done;approved+=done;const tr=document.createElement('tr');for(const value of [schoolName(i),a.title,records.length,ready-done,done,records.length-ready,Math.round(ready/records.length*100)+'%']){const td=document.createElement('td');td.textContent=value;td.style.cssText='padding:10px;border-bottom:1px solid #dce7e7;white-space:nowrap';tr.append(td)}t.append(tr)}table.append(t);panel.append(table);
const summary=document.createElement('p');summary.textContent='إجمالي طلبات الاعتماد المعلقة: '+pending+' | السجلات المعتمدة: '+approved;panel.append(summary);
const exportButton=document.createElement('button');exportButton.textContent='تصدير تقرير CSV';exportButton.onclick=()=>{const rows=[['المدرسة','حساب المدير','السجلات','بانتظار الاعتماد','معتمدة','نواقص','الإنجاز']];for(const tr of t.querySelectorAll('tr:not(:first-child)'))rows.push(Array.from(tr.children,x=>x.textContent));const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='تقرير-المدارس-التجريبية.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};panel.append(exportButton);
const print=document.createElement('button');print.className='secondary';print.textContent='طباعة التقرير';print.style.marginInlineStart='8px';print.onclick=()=>window.print();panel.append(print);
};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>document.getElementById('executiveReports')?.classList.add('hidden')));
})();
</script></body></html>
