<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شواهد — القوالب والسجلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--p:#0c4a53;--p2:#083a42;--t:#2bb3ad;--tl:#e6f6f5;--bg:#f2f5f6;--c:#fff;--tx:#13272c;--m:#637a80;--b:#e2ebed;--warn:#c2410c;--ok:#15803d;--sh:0 1px 2px rgba(12,74,83,.05),0 8px 24px rgba(12,74,83,.07)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
.top{background:var(--p);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:17px}
.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:0 14px;min-height:40px;cursor:pointer;display:none}
.top button.show{display:inline-block}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 4px;color:var(--p)}
.sub{color:var(--m);font-size:14px;margin:0 0 16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{min-height:46px;border:1px solid var(--b);border-radius:12px;padding:0 14px;background:#fff;color:var(--tx)}
.bar input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.rec{background:#fff;border:1px solid var(--b);border-radius:18px;box-shadow:var(--sh);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:start;cursor:pointer;width:100%;color:var(--tx);min-height:64px}
.rec b{display:block}
.rec small{color:var(--m)}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--tl);color:var(--p);white-space:nowrap}
.pill.review{background:#dff4f2;color:#0a6b66}
.pill.approved{background:#e3f4e8;color:var(--ok)}
.empty{background:#fff;border:1px dashed #c9d6da;border-radius:18px;padding:36px 18px;text-align:center;color:var(--m)}
.empty b{display:block;color:var(--tx);margin-bottom:6px;font-size:17px}
.card{background:#fff;border:1px solid var(--b);border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.seg{display:flex;gap:6px;background:#f2f6f7;padding:5px;border-radius:14px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;border:0;background:transparent;border-radius:10px;padding:10px;cursor:pointer;color:var(--m);min-height:44px}
.seg button.on{background:#fff;color:var(--p);font-weight:600;box-shadow:0 1px 4px rgba(12,74,83,.12)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:14px;color:var(--m)}
.field textarea{border:1px solid var(--b);border-radius:12px;padding:12px;min-height:110px;resize:vertical;color:var(--tx);background:#fff}
.field textarea:focus{outline:2px solid var(--t);border-color:transparent}
h3{font-size:16px;margin:20px 0 10px;color:var(--p)}
.off{background:#f7fafb;border:1px dashed #c9d6da;border-radius:12px;padding:14px;text-align:center;color:var(--m);font-size:14px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fi{border:1px solid var(--b);border-radius:12px;overflow:hidden;background:#fff}
.fi img{width:100%;height:110px;object-fit:cover;display:block}
.fi .fb{padding:10px;font-size:13px}
.fi a{color:var(--p);font-weight:600;text-decoration:none;word-break:break-word}
.tp{display:inline-block;font-size:11px;background:var(--tl);color:var(--p);padding:2px 8px;border-radius:99px;margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts button{min-height:44px;border:1px solid var(--b);background:#fff;border-radius:12px;padding:0 14px;color:var(--p);cursor:pointer}
.acts button[disabled]{color:#9fb3b8;cursor:not-allowed;background:#f7fafb}
.rnote{font-size:13px;color:var(--m);margin:8px 2px 0}
.hidden{display:none!important}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media print{.top,.acts,.bar{display:none!important}.wrap{padding:0}}
</style>
</head>
<body>

<header class="top">
  <b>شواهد</b>
  <button type="button" id="backBtn">رجوع</button>
</header>

<main class="wrap">
  <!-- قائمة القوالب -->
  <section id="listView">
    <h1>القوالب والسجلات</h1>
    <p class="sub" id="countLine"></p>
    <div class="bar">
      <input type="search" id="q" placeholder="ابحث باسم السجل" aria-label="بحث">
      <select id="f" aria-label="تصفية حسب الحالة">
        <option value="all">كل الحالات</option>
        <option value="draft">مسودة</option>
        <option value="review">جاهز للمراجعة</option>
        <option value="approved">معتمد</option>
      </select>
    </div>
    <div class="grid" id="list"></div>
  </section>

  <!-- تفاصيل السجل والشواهد -->
  <section id="detailView" class="hidden">
    <div class="card">
      <small id="dNo" style="color:var(--m)"></small>
      <h1 id="dTitle"></h1>
      <div class="seg" id="dSeg" role="group" aria-label="حالة السجل"></div>
      <label class="field">وصف الإنجاز<textarea id="dDesc" placeholder="اكتب وصف ما أنجزته في هذا السجل"></textarea></label>
      <label class="field">ملاحظات<textarea id="dNotes" placeholder="ملاحظات خاصة بالسجل"></textarea></label>
      <div class="acts">
        <button type="button" id="printBtn">طباعة السجل</button>
        <button type="button" id="exportBtn" disabled>تصدير</button>
      </div>
      <p class="rnote" id="exportNote">التصدير غير مفعّل بعد.</p>
    </div>
    <div class="card">
      <h3>المرفقات والشواهد</h3>
      <div id="uploadNote" class="off">رفع الشواهد غير مفعّل بعد.</div>
      <div id="files" class="files" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL = {draft:'مسودة', review:'جاهز للمراجعة', approved:'معتمد'};

// لا بيانات وهمية. للدمج: ShawahidTemplates.setData({records, canApprove, canExport, canUpload})
const D = {records: [], canApprove: false, canExport: false, canUpload: false};
let cur = null;

function renderList(){
  const q = $('#q').value.trim(), f = $('#f').value;
  const items = D.records.filter(r => (!q || r.title.includes(q)) && (f === 'all' || r.status === f));
  $('#countLine').textContent = D.records.length ? `${D.records.length} سجلًا` : 'لا توجد قوالب بعد';
  if (!items.length){
    $('#list').innerHTML = `<div class="empty" style="grid-column:1/-1"><b>${D.records.length ? 'لا توجد نتائج' : 'لا توجد سجلات بعد'}</b>${D.records.length ? 'جرّب تغيير البحث أو التصفية.' : 'ستظهر قوالب السجلات هنا عند توفرها.'}</div>`;
    return;
  }
  $('#list').innerHTML = items.map(r => `
    <button class="rec" data-id="${r.id}" type="button">
      <div><small>السجل ${r.no}</small><b>${esc(r.title)}</b></div>
      <span class="pill ${r.status}">${LBL[r.status]}</span>
    </button>`).join('');
}

function openRecord(id){
  cur = D.records.find(r => String(r.id) === String(id));
  if (!cur) return;
  $('#listView').classList.add('hidden');
  $('#detailView').classList.remove('hidden');
  $('#backBtn').classList.add('show');
  $('#dNo').textContent = `السجل ${cur.no} من ${D.records.length}`;
  $('#dTitle').textContent = cur.title;
  $('#dDesc').value = cur.desc || '';
  $('#dNotes').value = cur.notes || '';
  const states = ['draft','review', ...(D.canApprove ? ['approved'] : [])];
  $('#dSeg').innerHTML = states.map(s => `<button type="button" class="${cur.status===s?'on':''}" data-st="${s}">${LBL[s]}</button>`).join('');
  $('#exportBtn').disabled = !D.canExport;
  $('#exportNote').textContent = D.canExport ? '' : 'التصدير غير مفعّل بعد.';
  $('#uploadNote').classList.toggle('hidden', D.canUpload);
  const files = (cur.files || []).map(f => f.type === 'image'
    ? `<div class="fi"><img src="${esc(f.url)}" alt="${esc(f.name)}"><div class="fb">${esc(f.name)}</div></div>`
    : `<div class="fi"><div class="fb"><span class="tp">${f.type === 'pdf' ? 'PDF' : 'رابط'}</span><br><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a></div></div>`).join('');
  $('#files').innerHTML = files || (D.canUpload ? '<div class="off" style="grid-column:1/-1">لا توجد شواهد مرفوعة لهذا السجل.</div>' : '');
  window.scrollTo(0, 0);
}

function showList(){
  cur = null;
  $('#detailView').classList.add('hidden');
  $('#listView').classList.remove('hidden');
  $('#backBtn').classList.remove('show');
  renderList();
}

$('#list').onclick = e => { const b = e.target.closest('[data-id]'); if (b) openRecord(b.dataset.id); };
$('#q').oninput = renderList;
$('#f').onchange = renderList;
$('#backBtn').onclick = showList;
$('#dSeg').onclick = e => {
  const b = e.target.closest('[data-st]');
  if (!b || !cur) return;
  cur.status = b.dataset.st;
  openRecord(cur.id);
};
$('#dDesc').oninput = e => { if (cur) cur.desc = e.target.value; };
$('#dNotes').oninput = e => { if (cur) cur.notes = e.target.value; };
$('#printBtn').onclick = () => window.print();

window.ShawahidTemplates = {
  setData(data){
    Object.assign(D, data);
    D.records = (D.records || []).map((r, i) => ({no: r.no ?? i+1, status: 'draft', files: [], ...r}));
    renderList();
  }
};
renderList();
</script>
</body>
</html>
