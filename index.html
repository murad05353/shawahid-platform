<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شواهد | فحص دخول المالك</title>
<style>body{margin:0;background:#f3f6fb;color:#182838;font-family:system-ui,-apple-system,sans-serif;display:grid;min-height:100vh;place-items:center}main{background:white;border-radius:22px;padding:25px;width:min(88vw,450px);box-shadow:0 8px 30px #14314a14}h1{color:#226472;font-size:32px}p{line-height:1.8;color:#526273}label{display:block;margin:15px 0 7px;font-weight:700}input{width:100%;box-sizing:border-box;border:1px solid #b8c8d5;border-radius:12px;padding:13px;font:inherit;direction:ltr;text-align:left}button{width:100%;border:0;border-radius:12px;background:#286b78;color:white;padding:14px;font:inherit;font-weight:700;margin-top:17px}button:disabled{opacity:.6}pre{background:#edf4f6;border-radius:12px;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#6a7785;line-height:1.7;display:block}</style></head><body><main><h1>شواهد</h1><p>اختبار دخول مالك المنصة وفحص الصلاحية. لا يتم حذف أي ملف.</p><form id="login"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" value="alruwailimurad@gmail.com" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="run" type="submit">تسجيل الدخول وفحص الصلاحية</button></form><label>نتيجة الفحص</label><pre id="status" role="status">جاهز للاختبار.</pre><small>كلمة المرور تُرسل إلى Supabase عبر HTTPS ولا تُحفظ في الموقع. لا تشاركها مع أحد. هذه صفحة اختبار وليست المنصة النهائية.</small></main>
<script>
const root='https://svfoinsspuqxkxlcvqmq.supabase.co',key='sb_publishable_M3rwpCmiIMgOGswCqe3xCQ_MJWb4IUy';
const status=document.getElementById('status'),button=document.getElementById('run'),password=document.getElementById('password');
document.getElementById('login').addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;status.textContent='جارٍ تسجيل الدخول...';
 try{
 const response=await fetch(root+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:key},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:password.value}),cache:'no-store'});
 const data=await response.json();password.value='';
 if(!response.ok||!data.access_token){status.textContent='فشل الدخول: '+(data.error_description||data.msg||data.message||'تحقق من كلمة المرور وتفعيل الحساب');return;}
 status.textContent='نجح تسجيل الدخول. جارٍ فحص الصلاحية...';
 const test=await fetch(root+'/functions/v1/cleanup-unused-evidence',{method:'POST',headers:{Authorization:'Bearer '+data.access_token,apikey:key},cache:'no-store'});
 const raw=await test.text();let result;try{result=JSON.parse(raw)}catch{result={message:raw.slice(0,250)}}
 status.textContent=test.ok?'نجح فحص صلاحية مالك المنصة.\nالملفات المنتظرة: '+result.pending+'\nالملفات المحذوفة: '+result.deleted+'\nالوضع: '+result.mode:'تم تسجيل الدخول، لكن فحص الصلاحية لم ينجح (HTTP '+test.status+').\n'+(result.message||JSON.stringify(result));
 }catch(error){status.textContent='خطأ في الاتصال: '+error.message;}finally{button.disabled=false;}
});
</script></body></html>
