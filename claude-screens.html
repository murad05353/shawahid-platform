<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شواهد — تسجيل الدخول والمدارس والمستخدمون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--p:#0c4a53;--p2:#083a42;--t:#2bb3ad;--tl:#e6f6f5;--bg:#f2f5f6;--c:#fff;--tx:#13272c;--m:#637a80;--b:#e2ebed;--sh:0 1px 2px rgba(12,74,83,.05),0 8px 24px rgba(12,74,83,.07)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden}
button,input,select{font:inherit}
/* تسجيل الدخول */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--p),var(--p2) 60%,#0a2f35);padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.lcard{background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbrand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px;text-align:center}
.lbrand .logo{width:60px;height:60px;border-radius:18px;background:var(--t);display:grid;place-items:center;color:var(--p);font-weight:700;font-size:26px}
.lbrand h1{font-size:22px;margin:4px 0 0;color:var(--p)}
.lbrand p{margin:0;color:var(--m);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:14px;color:var(--m)}
.field input{border:1px solid var(--b);border-radius:12px;padding:0 14px;min-height:50px;font-size:16px;color:var(--tx);background:#fff}
.field input:focus{outline:2px solid var(--t);border-color:transparent}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
.btn:disabled,.btn[disabled]{background:#c9d6da;cursor:not-allowed}
.lnote{margin-top:14px;font-size:13px;color:var(--m);text-align:center;min-height:20px}
.lfoot{margin-top:16px;text-align:center;font-size:13px;color:var(--m)}
/* لوحة المدارس والمستخدمين */
.shell{display:none;min-height:100dvh}
.shell.on{display:block}
.top{background:var(--p);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px calc(40px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--b);border-radius:14px;padding:5px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;min-height:44px;cursor:pointer;color:var(--m)}
.tabs button.on{background:var(--tl);color:var(--p);font-weight:600}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{flex:1;min-width:180px;min-height:46px;border:1px solid var(--b);border-radius:12px;padding:0 14px;background:#fff}
.bar .btn{width:auto;padding:0 18px;min-height:46px}
.card{background:#fff;border:1px solid var(--b);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.card b{display:block}
.card small{color:var(--m)}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--tl);color:var(--p);white-space:nowrap}
.empty{background:#fff;border:1px dashed #c9d6da;border-radius:18px;padding:36px 18px;text-align:center;color:var(--m)}
.empty b{display:block;color:var(--tx);margin-bottom:6px;font-size:17px}
.note{font-size:13px;color:var(--m);margin:12px 2px 0}
@media (min-width:720px){.card{padding:18px 20px}}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول: واجهة فقط، ولا تغيّر منطق المصادقة الحالي -->
<section class="login" id="loginScreen">
  <form class="lcard" id="loginForm" autocomplete="on">
    <div class="lbrand">
      <div class="logo">ش</div>
      <h1>تسجيل الدخول إلى شواهد</h1>
      <p>منصة إدارة السجلات والشواهد المدرسية</p>
    </div>
    <label class="field">اسم المستخدم أو البريد الإلكتروني
      <input name="user" type="text" autocomplete="username" required>
    </label>
    <label class="field">كلمة المرور
      <input name="pass" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit" id="loginBtn">دخول</button>
    <div class="lnote" id="loginNote"></div>
    <div class="lfoot">نسيت كلمة المرور؟ تواصل مع مدير المنصة</div>
  </form>
</section>

<!-- شاشة المدارس والمستخدمين -->
<section class="shell" id="adminScreen">
  <header class="top"><b>شواهد</b><span id="who"></span></header>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="schools" type="button">المدارس</button>
      <button data-tab="users" type="button">المستخدمون</button>
    </div>
    <div class="bar">
      <input type="search" id="q" placeholder="ابحث بالاسم" aria-label="بحث">
      <button class="btn" id="addBtn" type="button" disabled>إضافة</button>
    </div>
    <div id="list"></div>
    <p class="note">زر الإضافة يُفعَّل فقط عند توفر صلاحية الإدارة في النظام.</p>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// لا توجد بيانات وهمية. للدمج: ShawahidScreens.setData({schools, users, canManage, user})
const D = {schools:[], users:[], canManage:false, user:{name:'', role:''}};
let tab = 'schools';

function renderList(){
  const q = $('#q').value.trim();
  const items = (tab === 'schools' ? D.schools : D.users)
    .filter(x => !q || String(x.name).includes(q));
  $('#addBtn').disabled = !D.canManage;
  $('#addBtn').textContent = tab === 'schools' ? 'إضافة مدرسة' : 'إضافة مستخدم';
  if (!items.length){
    $('#list').innerHTML = `<div class="empty"><b>${tab === 'schools' ? 'لا توجد مدارس بعد' : 'لا يوجد مستخدمون بعد'}</b>${q ? 'لا توجد نتائج مطابقة للبحث.' : 'ستظهر القائمة هنا عند توفر البيانات.'}</div>`;
    return;
  }
  $('#list').innerHTML = items.map(x => `
    <div class="card">
      <div><b>${esc(x.name)}</b><small>${esc(tab === 'schools' ? (x.city || '') : (x.roleLabel || ''))}</small></div>
      <span class="pill">${esc(x.status || 'نشط')}</span>
    </div>`).join('');
}

document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  renderList();
});
$('#q').oninput = renderList;

$('#loginForm').onsubmit = e => {
  e.preventDefault();
  // ربط المصادقة الفعلي يتم عبر النظام الحالي فقط
  $('#loginNote').textContent = 'ربط تسجيل الدخول غير مفعّل في هذا التصميم.';
};

window.ShawahidScreens = {
  showLogin(){ $('#loginScreen').style.display = ''; $('#adminScreen').classList.remove('on'); },
  showAdmin(){ $('#loginScreen').style.display = 'none'; $('#adminScreen').classList.add('on'); $('#who').textContent = D.user.name || ''; renderList(); },
  setData(data){ Object.assign(D, data); renderList(); }
};
ShawahidScreens.showLogin();
</script>
</body>
</html>
